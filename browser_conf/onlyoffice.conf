[program:onlyoffice]
command=sh -c "[ -x /usr/bin/onlyoffice-desktopeditors ] && /usr/bin/onlyoffice-desktopeditors || ( OFFICE_BIN=$(find /opt /usr /bin -type f -name 'DesktopEditors' -o -name '*onlyoffice*' -o -name '*desktopeditors*' 2>/dev/null | head -1) && [ ! -z \"$OFFICE_BIN\" ] && $OFFICE_BIN )"
environment=DISPLAY=:0
autostart=true
autorestart=true
user=rdpuser
stdout_logfile=/var/log/onlyoffice.log
stderr_logfile=/var/log/onlyoffice.err.log