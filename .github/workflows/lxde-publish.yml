name: Build and Push Docker Image - LXDE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-lxde
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: lxde-debian.dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # kind load image-archive fails on multi-arch manifests because the saved
      # tarball references platform variants that are not present locally. Push
      # single-platform per-arch "latest" tags so local KIND clusters on either
      # x86_64 or arm64 can import the image after
      # "docker pull --platform <arch> ...:latest-<arch> && docker save ...".
      - name: Build and push single-platform latest-amd64 image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: lxde-debian.dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-lxde:latest-amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Build and push single-platform latest-arm64 image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: lxde-debian.dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-lxde:latest-arm64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Get image size
        id: image-size
        if: github.event_name != 'pull_request'
        run: |
          # Get the first tag to inspect
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Inspecting image: $IMAGE_TAG"
          # Pull one platform variant to get size
          docker pull --platform linux/amd64 $IMAGE_TAG
          SIZE=$(docker image inspect $IMAGE_TAG --format='{{.Size}}')
          SIZE_MB=$(echo "scale=2; $SIZE/1024/1024" | bc)
          echo "size=$SIZE_MB MB" >> $GITHUB_OUTPUT
          echo "Image size: $SIZE_MB MB"
